<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">

  <!-- Dark Wood Background -->
  <rect width="64" height="64" rx="8" fill="#3b2416"/>

  <!-- Tavern Sign Border -->
  <rect x="3" y="3" width="58" height="58" rx="6"
        fill="none" stroke="#1a0f09" stroke-width="4"/>

  <!-- Inner Brass Ring -->
  <circle cx="32" cy="32" r="20"
          fill="none" stroke="#c9a44d" stroke-width="4"/>

  <!-- Center Hub -->
  <circle cx="32" cy="32" r="6" fill="#c9a44d"/>

  <!-- Ship Wheel Spokes -->
  <g stroke="#c9a44d" stroke-width="4" stroke-linecap="round">
    <line x1="32" y1="10" x2="32" y2="20"/>
    <line x1="32" y1="44" x2="32" y2="54"/>
    <line x1="10" y1="32" x2="20" y2="32"/>
    <line x1="44" y1="32" x2="54" y2="32"/>
    <line x1="17" y1="17" x2="24" y2="24"/>
    <line x1="40" y1="40" x2="47" y2="47"/>
    <line x1="47" y1="17" x2="40" y2="24"/>
    <line x1="17" y1="47" x2="24" y2="40"/>
  </g>

</svg>
